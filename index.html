<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="menu-container"></div>

  <div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="img/B1.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="img/B2.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="img/B3.png" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

<div class="px-4 py-5 my-5 text-center">

    <!-- Logo ปรับใหญ่ขึ้น -->
    <img class="d-block mx-auto mb-4"
         src="img/Logo_1.png"
         alt="Cat Logo"
         width="180">

    <!-- หัวข้อ -->
    <h1 class="display-5 fw-bold">Welcome to Cat Lovers</h1>

    <div class="col-lg-6 mx-auto">

        <!-- รายละเอียด -->
        <p class="lead mb-4">
            Discover the wonderful world of cats. 
            Learn about different cat breeds, their personalities, 
            and simple tips for taking care of your lovely feline friends.
        </p>

        <!-- ปุ่ม -->
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="product.html" class="btn btn-primary btn-lg px-4">
                Explore Cats
            </a>

            <a href="about.html" class="btn btn-outline-secondary btn-lg px-4">
                About Us
            </a>
        </div>

    </div>
</div>

<div class="container">

  <h3 class="alert alert-primary mt-4">หน้าหลัก</h3>

  
  <div class="alert alert-light text-left shadow-sm">
    <h5 class="mb-1">Hello Kaewalin</h5>
    <p class="mb-0 text-secondary">ยินดีต้อนรับเข้าสู่เว็บไซต์ของเรา</p>
  </div>

  <div class="mb-4">
    <a class="btn btn-primary" href="https://www.google.com/" target="_blank">Google</a>
  
  </div>

  <div class="row mb-4">

    <div class="col-md-4 mb-3">
      <div class="card h-100 shadow-sm">
        <img src="img/cat1.png" class="card-img-top" alt="photo1" height="100%" width="100%">
        <div class="card-body text-center">
          <h6 class="card-title mb-0">tawhancat</h6>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-3">
      <div class="card h-100 shadow-sm">
        <img src="img/cat2.jpeg" class="card-img-top" alt="photo2" height="100%" width="100%">
        <div class="card-body text-center">
          <h6 class="card-title mb-0">lunacat</h6>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-3">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h4 class="text-center mb-3">Register</h4>
          <form>
            <div class="mb-3">
              <label class="form-label">Firstname</label>
              <input type="text" class="form-control" id="firstname" required placeholder="input firstname">
            </div>
            <div class="mb-3">
              <label class="form-label">Lastname</label>
              <input type="text" class="form-control" id="lastname" required placeholder="input lastname">
            </div>
            <div class="mb-3">
              <label class="form-label">Telephone</label>
              <input type="tel" class="form-control" id="telephone" required placeholder="ex xxx-xxx-xxxx">
            </div>
            <div class="mb-3">
              <label class="form-label">Province</label>
              <select class="form-select" id="province" required>
                <option value="" selected disabled>เลือกจังหวัด</option>
                <option value="1">ชลบุรี</option>
                <option value="2">ระยอง</option>
                <option value="3">สมุทรปราการ</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" required placeholder="input email">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required placeholder="input password">
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary">Submit</button>
              <button type="reset" class="btn btn-light">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>

</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
