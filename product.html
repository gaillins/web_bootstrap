    <link href="css/bootstrap.min.css" rel="stylesheet">

    <title>Product</title>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .product-header {
            background-color: #cfe2ff;
            border: 1px solid #9ec5fe;
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .product-card {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            overflow: hidden;
            height: 100%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        .product-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        /* ช่องสำหรับ Product ที่ยังไม่มีรูป */
        .image-placeholder {
            width: 100%;
            height: 320px;
            background-color: #e9ecef;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #6c757d;
            font-size: 18px;
        }

        .product-body {
            padding: 18px;
            text-align: center;
        }

        .product-title {
            font-size: 20px;
            font-weight: bold;
        }

        .product-price {
            color: #6c757d;
            margin-bottom: 15px;
        }

        /* Cart */
        .cart-box {
            position: relative;
            color: white;
            font-size: 26px;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;

            background-color: red;
            color: white;

            font-size: 11px;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            text-align: center;
            line-height: 20px;
        }
    </style>

</head>
